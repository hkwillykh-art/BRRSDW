name: BRRS checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "httpx>=0.27,<1" "pytest>=8,<10"
      - name: Compile Python sources
        run: python -m compileall -q app.py cloud_backend.py
      - name: Smoke checks
        run: pytest -q tests
