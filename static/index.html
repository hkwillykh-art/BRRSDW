<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRRS V3.0｜籃球裁判判例分析系統</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color-scheme:dark;--bg:#0b1019;--panel:#182231;--border:#334155;--text:#f1f5f9;--muted:#a9b7c9;--accent:#ff923b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{padding:18px max(18px,calc((100vw - 1250px)/2));background:#111b29;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:25px}h2{font-size:21px;margin:0 0 15px}h3{margin:12px 0}small,.muted{color:var(--muted)}main{max-width:1250px;margin:auto;padding:22px 15px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:10px 0}input,select,textarea,button{font:inherit;border-radius:8px;padding:10px;background:#101928;border:1px solid #445369;color:var(--text)}input,textarea,select{max-width:100%}input[type=range]{padding:0;flex:1;min-width:140px}textarea{width:100%;min-height:85px}button{cursor:pointer}button.primary{background:var(--accent);color:#151515;border:0;font-weight:700}button:hover{filter:brightness(1.13)}button:disabled{opacity:.5;cursor:not-allowed}button.danger{background:#632027;color:#fff;border:1px solid #e16c6c}button.danger:hover{background:#812a33}.wide{width:100%}.hide{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button.active{background:var(--accent);color:#111}.card{padding:13px;border:1px solid var(--border);border-radius:9px;margin:8px 0;cursor:pointer}.card:hover{border-color:var(--accent)}.selected{border-color:var(--accent)}.videoWrap{position:relative;background:#05080c;max-width:100%;overflow:hidden}video{width:100%;max-height:470px;display:block}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;pointer-events:none}.tag{color:var(--accent);font-weight:700}.status{min-height:22px;color:#ffd19f}.vote{padding:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:7px 0;color:var(--muted)}label input,label select{display:block;width:100%;margin-top:4px}code{background:#101928;padding:5px;border-radius:5px;overflow-wrap:anywhere}@media(max-width:820px){.grid,.two{grid-template-columns:1fr}header{padding:15px}h1{font-size:20px}.panel{padding:14px}}
</style></head><body><header><div><h1>🏀 BRRS <span class="tag">V3.0</span></h1><small>Basketball Referee Review System · 多人協作測試版</small></div><div><span id="who"></span> <button id="logout" class="hide">登出</button></div></header><main><div id="status" class="status" role="status"></div>
<section id="auth" class="panel"><h2>裁判登入／註冊</h2><div class="two"><div><h3>登入</h3><label>Email<input id="loginEmail" type="email"></label><label>密碼<input id="loginPass" type="password"></label><button class="primary" id="loginBtn">登入</button></div><div><h3>建立帳號</h3><label>裁判顯示名稱<input id="regName"></label><label>Email<input id="regEmail" type="email"></label><label>密碼（至少8字）<input id="regPass" type="password"></label><button id="regBtn">註冊</button></div></div></section>
<section id="app" class="hide"><div class="panel"><h2>👥 裁判群組</h2><div class="row"><select id="groupSelect" aria-label="選擇群組"></select><button id="refresh">重新整理</button><button id="deleteGroup" class="danger hide">刪除群組</button></div><div class="row"><input id="groupName" placeholder="新群組名稱"><button id="createGroup">建立群組</button><input id="inviteInput" placeholder="輸入邀請碼"><button id="joinGroup">加入群組</button></div><div id="inviteDisplay" class="muted"></div></div>
<div class="tabs"><button data-tab="studio" class="active">🎬 剪輯工作室</button><button data-tab="library">📚 判例資料庫</button><button data-tab="discussion">💬 判例討論</button></div>
<section id="studio"><div class="grid"><div class="panel"><h2>影片剪輯與畫面標記</h2><label>選擇本機影片（可先預覽，不會自動上傳）<input id="localVideo" type="file" accept="video/*"></label><div class="videoWrap" id="videoWrap"><video id="video" controls playsinline></video><canvas id="canvas"></canvas></div><div class="row"><button id="prevFrame">◀ 逐格</button><button id="nextFrame">逐格 ▶</button><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><span id="clock">00:00 / 00:00</span></div><div class="row"><button id="markStart">設為起點</button><span id="startTime">起點 00:00</span><button id="markEnd">設為終點</button><span id="endTime">終點 00:00</span><button id="playSegment">播放片段</button></div><div class="row"><button id="drawToggle">✏️ 啟用標記</button><select id="drawMode"><option value="line">直線</option><option value="circle">圈選</option><option value="arrow">箭頭</option></select><button id="undo">復原</button><button id="clear">清除</button></div><p class="muted">畫面標記只在本機預覽，不會燒錄至影片；時間標記會隨判例儲存。YouTube 可用外部連結記錄，不能直接擷取影片。</p></div>
<div class="panel"><h2>建立判例</h2><label>判例名稱<input id="caseTitle" placeholder="例如：第四節阻擋／帶球撞人"></label><div class="two"><label>比賽名稱<input id="game"></label><label>節次<input id="period" placeholder="Q4"></label></div><label>判例分類<select id="category"><option>阻擋／帶球撞人</option><option>帶球走步</option><option>違反運動精神犯規</option><option>技術犯規</option><option>掩護犯規</option><option>非法用手</option><option>24秒違例</option><option>裁判站位與輪轉</option><option>其他</option></select></label><label>原始宣判<input id="original"></label><label>FIBA規則依據<input id="rule" placeholder="例如：Art. 33"></label><label>分析說明<textarea id="notes"></textarea></label><label>外部影片連結（選填）<input id="sourceUrl" placeholder="https://..."></label><button class="primary wide" id="saveCase">儲存至群組資料庫</button><p class="muted">儲存判例後，如果選擇了本機影片，會再上傳至伺服器（上限由管理員設定，預設200MB）。</p></div></div></section>
<section id="library" class="panel hide"><h2>📚 群組判例資料庫</h2><input id="search" class="wide" placeholder="搜尋判例名稱、分類、比賽、規則"><div id="caseList"></div></section>
<section id="discussion" class="panel hide"><h2>💬 判例討論</h2><select id="caseSelect" class="wide"></select><div class="row"><button id="deleteCase" class="danger hide">刪除目前判例</button></div><div id="detail"></div><div id="discussionContent"></div><h3>投票（非官方裁定）</h3><div class="row" id="voteChoices"><button class="vote" data-choice="正確宣判">正確宣判</button><button class="vote" data-choice="錯誤宣判">錯誤宣判</button><button class="vote" data-choice="需要更多角度">需要更多角度</button></div><h3>發表分析</h3><textarea id="commentBody" placeholder="說明判斷及規則依據"></textarea><button id="sendComment" class="primary">發表留言</button></section>
</section></main><script>
const $=id=>document.getElementById(id);let myUserId='',token=sessionStorage.getItem('brrs_token')||'',groups=[],cases=[],currentGroup='',localURL='',start=0,end=0,loop=false,marks=[],drawing=false,anchor=null;
function status(s){$('status').textContent=s;setTimeout(()=>{if($('status').textContent===s)$('status').textContent=''},6500)}
async function api(path,options={}){const headers={...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;if(options.body&&!(options.body instanceof FormData))headers['Content-Type']='application/json';const res=await fetch('/api'+path,{...options,headers});let data;try{data=await res.json()}catch{data={detail:'伺服器回應異常'}}if(!res.ok)throw Error(typeof data.detail==='string'?data.detail:'操作失敗');return data}
async function action(fn){try{await fn()}catch(e){status('⚠️ '+e.message)}}
function showAuth(logged){$('auth').classList.toggle('hide',logged);$('app').classList.toggle('hide',!logged);$('logout').classList.toggle('hide',!logged)}
$('regBtn').onclick=()=>action(async()=>{await api('/register',{method:'POST',body:JSON.stringify({name:$('regName').value,email:$('regEmail').value,password:$('regPass').value})});status('註冊成功，請登入')});
$('loginBtn').onclick=()=>action(async()=>{const r=await api('/login',{method:'POST',body:JSON.stringify({email:$('loginEmail').value,password:$('loginPass').value})});token=r.token;myUserId=r.user.id;sessionStorage.setItem('brrs_token',token);$('who').textContent=r.user.name;showAuth(true);await loadGroups()});
$('logout').onclick=()=>action(async()=>{await api('/logout',{method:'POST'});token='';myUserId='';sessionStorage.removeItem('brrs_token');$('who').textContent='';showAuth(false)});
async function loadGroups(){groups=await api('/groups');$('groupSelect').replaceChildren(...groups.map(g=>new Option(g.name,g.id)));currentGroup=groups.some(g=>g.id===currentGroup)?currentGroup:(groups[0]?.id||'');$('groupSelect').value=currentGroup;showInvite();await loadCases()}
function showInvite(){const g=groups.find(g=>g.id===currentGroup);$('deleteGroup').classList.toggle('hide',!g||g.role!=='owner');$('inviteDisplay').textContent=g?'群組邀請碼：'+g.invite+'（只分享給信任的裁判）':'尚無群組，請建立或加入'}
$('groupSelect').onchange=()=>action(async()=>{currentGroup=$('groupSelect').value;showInvite();await loadCases()});$('refresh').onclick=()=>action(loadGroups);
$('createGroup').onclick=()=>action(async()=>{await api('/groups',{method:'POST',body:JSON.stringify({name:$('groupName').value})});$('groupName').value='';await loadGroups();status('群組建立成功')});
$('joinGroup').onclick=()=>action(async()=>{await api('/groups/join',{method:'POST',body:JSON.stringify({code:$('inviteInput').value})});$('inviteInput').value='';await loadGroups();status('已加入群組')});
$('deleteGroup').onclick=()=>action(async()=>{const g=groups.find(x=>x.id===currentGroup);if(!g||g.role!=='owner')throw Error('只有群組建立者可以刪除群組');if(!confirm('確定刪除「'+g.name+'」群組？所有判例、影片、投票與留言都會一起刪除，無法復原！'))return;const typed=prompt('為避免誤刪，請輸入完整群組名稱：'+g.name);if(typed!==g.name){if(typed!==null)status('群組名稱不一致，已取消刪除');return}await api('/groups/'+encodeURIComponent(g.id),{method:'DELETE'});currentGroup='';await loadGroups();status('群組及相關判例已刪除')});
async function loadCases(){if(!currentGroup){cases=[]}else cases=await api('/cases?group_id='+encodeURIComponent(currentGroup));renderCases()}
function renderCases(){const q=$('search').value.toLowerCase();$('caseList').replaceChildren(...cases.filter(c=>[c.title,c.game,c.category,c.rule].join(' ').toLowerCase().includes(q)).map(c=>{let d=document.createElement('div');d.className='card';d.textContent=`${c.title}｜${c.category||'未分類'}｜${c.game||''}｜上傳者：${c.author_name}`;d.onclick=()=>{selectTab('discussion');$('caseSelect').value=c.id;loadDiscussion()};return d}));const prev=$('caseSelect').value;$('caseSelect').replaceChildren(...cases.map(c=>new Option(c.title,c.id)));if(cases.some(c=>c.id===prev))$('caseSelect').value=prev;loadDiscussion()}
$('search').oninput=renderCases;function selectTab(id){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));['studio','library','discussion'].forEach(x=>$(x).classList.toggle('hide',x!==id))}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
const video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');function clock(t){if(!Number.isFinite(t))return '00:00';return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function resize(){const rect=video.getBoundingClientRect();canvas.width=Math.max(1,Math.round(rect.width));canvas.height=Math.max(1,Math.round(rect.height));renderMarks()}window.addEventListener('resize',resize);video.addEventListener('loadedmetadata',()=>{end=video.duration||0;updateClock();resize()});video.addEventListener('timeupdate',()=>{updateClock();if(loop&&video.currentTime>=end){loop=false;video.pause()}});function updateClock(){$('clock').textContent=clock(video.currentTime)+' / '+clock(video.duration);$('startTime').textContent='起點 '+clock(start);$('endTime').textContent='終點 '+clock(end)}
$('localVideo').onchange=()=>{if(localURL)URL.revokeObjectURL(localURL);const f=$('localVideo').files[0];if(!f)return;localURL=URL.createObjectURL(f);video.src=localURL;video.load();start=0;marks=[];renderMarks()};$('speed').onchange=()=>video.playbackRate=Number($('speed').value);$('prevFrame').onclick=()=>{video.pause();video.currentTime=Math.max(0,video.currentTime-1/30)};$('nextFrame').onclick=()=>{video.pause();video.currentTime=Math.min(video.duration||0,video.currentTime+1/30)};
$('markStart').onclick=()=>{start=video.currentTime;updateClock()};$('markEnd').onclick=()=>{end=video.currentTime;updateClock()};$('playSegment').onclick=()=>{if(end<=start)return status('請設定正確的起訖時間');video.currentTime=start;loop=true;video.play().catch(()=>{})};
$('drawToggle').onclick=()=>{drawing=!drawing;canvas.style.pointerEvents=drawing?'auto':'none';$('drawToggle').textContent=drawing?'✏️ 關閉標記':'✏️ 啟用標記'};function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}canvas.onpointerdown=e=>{anchor=pos(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=e=>{if(!anchor)return;marks.push({from:anchor,to:pos(e),mode:$('drawMode').value});anchor=null;renderMarks()};function renderMarks(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ff923b';ctx.fillStyle='#ff923b';ctx.lineWidth=3;marks.forEach(m=>{const a={x:m.from.x*canvas.width,y:m.from.y*canvas.height},b={x:m.to.x*canvas.width,y:m.to.y*canvas.height};ctx.beginPath();if(m.mode==='circle'){ctx.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(2,Math.abs(a.x-b.x)/2),Math.max(2,Math.abs(a.y-b.y)/2),0,0,Math.PI*2)}else{ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.stroke();if(m.mode==='arrow'){let ang=Math.atan2(b.y-a.y,b.x-a.x);for(let sign of [-1,1]){ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-14*Math.cos(ang+sign*.5),b.y-14*Math.sin(ang+sign*.5));ctx.stroke()}}})}$('undo').onclick=()=>{marks.pop();renderMarks()};$('clear').onclick=()=>{marks=[];renderMarks()};
$('saveCase').onclick=()=>action(async()=>{if(!currentGroup)throw Error('請先建立或加入群組');const fields={group_id:currentGroup,title:$('caseTitle').value,game:$('game').value,period:$('period').value,category:$('category').value,original:$('original').value,rule:$('rule').value,notes:$('notes').value,source_url:$('sourceUrl').value,start,end:Number.isFinite(end)?end:0};const c=await api('/cases',{method:'POST',body:JSON.stringify(fields)});const f=$('localVideo').files[0];if(f){status('正在上傳影片，請勿關閉網頁…');const form=new FormData();form.append('file',f);try{await api('/cases/'+c.id+'/video',{method:'POST',body:form})}catch(e){status('判例已建立，但影片上傳失敗：'+e.message);await loadCases();return}}await loadCases();status('判例已儲存至群組資料庫')});
$('caseSelect').onchange=()=>action(loadDiscussion);
$('deleteCase').onclick=()=>action(async()=>{const cid=$('caseSelect').value,c=cases.find(x=>x.id===cid),g=groups.find(x=>x.id===currentGroup);if(!c)throw Error('請先選擇判例');if(c.author!==myUserId&&g?.role!=='owner')throw Error('只有上傳者或群組建立者可以刪除判例');if(!confirm('確定刪除判例「'+c.title+'」？影片、投票與留言都會一起刪除，且無法復原。'))return;await api('/cases/'+encodeURIComponent(cid),{method:'DELETE'});await loadCases();status('判例已刪除')});
async function loadDiscussion(){const cid=$('caseSelect').value;$('deleteCase').classList.add('hide');$('detail').replaceChildren();$('discussionContent').replaceChildren();if(!cid)return;const c=cases.find(x=>x.id===cid);if(!c)return;const g=groups.find(x=>x.id===currentGroup);$('deleteCase').classList.toggle('hide',c.author!==myUserId&&g?.role!=='owner');let detail=document.createElement('div');detail.className='card';let p=document.createElement('p');p.textContent=`${c.game||''} ${c.period||''}｜${c.category||''}｜${c.original||''}｜${c.rule||''}｜${c.notes||''}`;detail.append(p);let t=document.createElement('p');t.textContent=`片段：${clock(c.start)}–${clock(c.end)}`;detail.append(t);if(c.video){let btn=document.createElement('button');btn.textContent='▶ 播放群組影片';btn.onclick=()=>action(async()=>{let r=await api('/cases/'+cid+'/play');let v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=r.url;v.style.width='100%';detail.append(v);v.currentTime=c.start||0;v.play().catch(()=>{})});detail.append(btn)}if(c.source_url){let a=document.createElement('a');a.textContent='開啟外部影片連結';a.href=c.source_url;a.target='_blank';a.rel='noopener noreferrer';a.style.color='#ff923b';detail.append(' ',a)}$('detail').append(detail);try{let d=await api('/cases/'+cid+'/discussion');let h=document.createElement('p');h.textContent='投票統計：'+(d.votes.map(v=>v.choice+' '+v.count+'票').join('／')||'尚無投票')+'；我的選擇：'+(d.my_vote||'未投票');$('discussionContent').append(h);document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=!!d.my_vote;b.title=d.my_vote?'此帳號已投票，不能重複投票或更改選項':''});d.comments.forEach(c=>{let e=document.createElement('div');e.className='card';e.textContent=c.author_name+'：'+c.body;$('discussionContent').append(e)})}catch(e){status(e.message)}}
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>action(async()=>{let cid=$('caseSelect').value;if(!cid)throw Error('請先選擇判例');await api('/cases/'+cid+'/votes',{method:'POST',body:JSON.stringify({choice:b.dataset.choice})});await loadDiscussion()}));$('sendComment').onclick=()=>action(async()=>{let cid=$('caseSelect').value;if(!cid)throw Error('請先選擇判例');await api('/cases/'+cid+'/comments',{method:'POST',body:JSON.stringify({body:$('commentBody').value})});$('commentBody').value='';await loadDiscussion()});
if(token)action(async()=>{try{let u=await api('/me');myUserId=u.id;$('who').textContent=u.name;showAuth(true);await loadGroups()}catch{token='';myUserId='';sessionStorage.removeItem('brrs_token');showAuth(false)}});else showAuth(false);
</script></body></html>
